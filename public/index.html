<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEV@Deakin | Daily Insider</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f7fb;
      color: #202633;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(100%, 520px);
      padding: 36px;
      background: #fff;
      border: 1px solid #e5e9f0;
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(28, 43, 64, .08);
    }
    h1 { margin: 0 0 10px; color: #182b49; }
    h2 { margin: 0 0 12px; font-size: 1.2rem; }
    p { color: #5b6574; line-height: 1.55; }
    label { display: block; margin: 22px 0 8px; font-weight: 600; }
    input {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #cbd3df;
      border-radius: 7px;
      font-size: 1rem;
    }
    button {
      margin-top: 14px;
      min-height: 44px;
      padding: 0 20px;
      border: 0;
      border-radius: 7px;
      background: #d63384;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #b52b70; }
    button:focus-visible, input:focus-visible { outline: 3px solid #91b8ff; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to DEV@Deakin</h1>
    <h2>Sign Up for Our Daily Insider</h2>
    <p>Enter your email address to subscribe to our daily insider and receive a welcome email.</p>

    <form action="/subscribe" method="POST">
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email address"
        autocomplete="email"
        required
      >
      <button type="submit">Subscribe</button>
    </form>
  </main>
</body>
</html>
